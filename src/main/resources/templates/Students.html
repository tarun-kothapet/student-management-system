<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Details</title>

<style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:40px;
}

.container{
    width:80%;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h1{
    text-align:center;
}

.add-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.add-btn:hover{
    background:#084298;
}

table{
    width:100%;
    border-collapse:collapse;
}

table th{
    background:#0d6efd;
    color:white;
    padding:12px;
}

table td{
    text-align:center;
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#ececec;
}

.btn-update{
    text-decoration:none;
    color:white;
    background:green;
    padding:8px 15px;
    border-radius:5px;
}

.btn-update:hover{
    background:darkgreen;
}

.btn-delete{
    text-decoration:none;
    color:white;
    background:red;
    padding:8px 15px;
    border-radius:5px;
}

.btn-delete:hover{
    background:darkred;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Details</h1>

<a th:href="@{/}" class="add-btn">
    Add New Student
</a>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Update</th>
<th>Delete</th>

</tr>

</thead>

<tbody>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>

<td th:text="${student.name}"></td>

<td th:text="${student.course}"></td>

<td>

<a th:href="@{/edit/{Id}(Id=${student.id})}" class="btn-update">
    Update
</a>

</td>

<td>

<a th:href="@{/delete/{Id}(Id=${student.id})}"
   class="btn-delete"
   onclick="return confirm('Are you sure you want to delete this student?')">

    Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
