<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Registration</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
}

.top-buttons{
    display:flex;
    justify-content:flex-end;
    margin:20px;
}

.list-btn{
    text-decoration:none;
    color:white;
    background:#28a745;
    padding:10px 15px;
    border-radius:5px;
}

.list-btn:hover{
    background:#218838;
}

.container{
    width:350px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}

</style>

</head>
<body>

<div class="top-buttons">

    <a th:href="@{/Students}" class="list-btn">
        Student List
    </a>

</div>

<div class="container">

<h2>Student Registration</h2>

<form th:action="@{/Register}" th:object="${student}" method="post">

    <label>Name</label>
    <input type="text" th:field="*{name}" placeholder="Enter Name" required>

    <label>Course</label>
    <input type="text" th:field="*{course}" placeholder="Enter Course" required>

    <button type="submit">Register</button>

</form>

</div>

</body>
</html>
