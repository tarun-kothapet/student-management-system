<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Edit Student</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.container{
    width:350px;
    margin:50px auto;
    background:white;
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:8px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:10px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    text-decoration:none;
    background:#6c757d;
    color:white;
    padding:8px 15px;
    border-radius:5px;
}

.back-btn:hover{
    background:#5a6268;
}

</style>

</head>

<body>

<div class="container">

<a th:href="@{/Students}" class="back-btn">Back</a>

<h2>Edit Student</h2>

<form th:action="@{/update}" th:object="${student}" method="post">

    <!-- Hidden Id -->
    <input type="hidden" th:field="*{id}">

    <label>Name</label>

    <input type="text"
           th:field="*{name}"
           required>

    <label>Course</label>

    <input type="text"
           th:field="*{course}"
           required>

    <button type="submit">
        Update Student
    </button>

</form>

</div>

</body>
</html>
